[tox]
envlist = linters
minversion = 2.9
skipsdist = True
sitepackages=False

[testenv]
basepython = python3
install_command = pip install -U \
    {opts} {packages} \
    -c{env:TOX_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt}
setenv =
   VIRTUAL_ENV={envdir}
   OS_STDOUT_CAPTURE=1
   OS_STDERR_CAPTURE=1
   OS_DEBUG=1
   OS_LOG_CAPTURE=1
deps =
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements.txt
allowlist_externals =
  bash

[testenv:flake8]
description = Dummy environment to allow flake8 to be run in subdir tox

[testenv:pylint]
description = Dummy environment to allow pylint to be run in subdir tox

[testenv:metadata]
description = Dummy environment to allow sysinv-app to be run in subdir tox

[testenv:bandit]
description = Dummy environment to allow bandit to be run in subdir tox

[testenv:bashate]
# Treat all E* codes as Errors rather than warnings using: -e 'E*'
commands =
  bash -c "find {toxinidir}                    \
         -not \( -type d -name .?\* -prune \) \
         -type f                              \
         -not -name \*~                       \
         -not -name \*.md                     \
         -name \*.sh                          \
         -print0 | xargs -r -n 1 -0 bashate -v   \
         -e 'E*'"

[testenv:linters]
commands =
    {[testenv:bashate]commands}

[testenv:coverage]
deps =
  pytest
  pytest-cov
  mock
  PyYAML
commands =
  pytest tests/ \
    --cov=python3-k8sapp-security-profiles-operator/k8sapp_security_profiles_operator/k8sapp_security_profiles_operator \
    --cov-report=term-missing \
    --cov-report=html:{toxinidir}/UTCoverage/htmlcov \
    --cov-report=xml:{toxinidir}/UTCoverage/coverage.xml \
    --cov-fail-under=85 \
    --cov-config={toxinidir}/.coveragerc \
    -v {posargs}
allowlist_externals =
  bash

[testenv:security]
deps =
  bandit
commands =
  bash -c "mkdir -p {toxinidir}/UTCoverage"
  bash -c "bandit -r \
    python3-k8sapp-security-profiles-operator/k8sapp_security_profiles_operator/k8sapp_security_profiles_operator \
    -n 5 --skip B110 -f txt -o {toxinidir}/UTCoverage/security_report.txt \
    -x tests"
  bash -c "bandit -r \
    python3-k8sapp-security-profiles-operator/k8sapp_security_profiles_operator/k8sapp_security_profiles_operator \
    -n 5 --skip B110 -f json -o {toxinidir}/UTCoverage/bandit-report.json \
    -x tests"
allowlist_externals =
  bash

[testenv:py313]
basepython = python3.13
description = Dummy environment to allow py313 to be run in subdir tox

[testenv:flake8-trixie]
description = Dummy environment to allow flake8-trixie to be run in subdir tox

[testenv:pylint-trixie]
description = Dummy environment to allow pylint-trixie to be run in subdir tox

[testenv:coverage-trixie]
basepython = python3.13
deps =
  pytest
  pytest-cov
  mock
  PyYAML
install_command = pip install \
    -chttps://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt \
    {opts} {packages}
commands =
  pytest tests/ \
    --cov=python3-k8sapp-security-profiles-operator/k8sapp_security_profiles_operator/k8sapp_security_profiles_operator \
    --cov-report=term-missing \
    --cov-report=html:{toxinidir}/UTCoverage/htmlcov \
    --cov-report=xml:{toxinidir}/UTCoverage/coverage.xml \
    --cov-fail-under=85 \
    --cov-config={toxinidir}/.coveragerc \
    -v {posargs}
allowlist_externals =
  bash

[testenv:security-trixie]
basepython = python3.13
deps =
  bandit
install_command = pip install \
    -chttps://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt \
    {opts} {packages}
commands =
  bash -c "mkdir -p {toxinidir}/UTCoverage"
  bash -c "bandit -r \
    python3-k8sapp-security-profiles-operator/k8sapp_security_profiles_operator/k8sapp_security_profiles_operator \
    -n 5 --skip B110 -f txt -o {toxinidir}/UTCoverage/security_report.txt \
    -x tests"
  bash -c "bandit -r \
    python3-k8sapp-security-profiles-operator/k8sapp_security_profiles_operator/k8sapp_security_profiles_operator \
    -n 5 --skip B110 -f json -o {toxinidir}/UTCoverage/bandit-report.json \
    -x tests"
allowlist_externals =
  bash
