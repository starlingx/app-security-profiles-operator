[metadata]
name = k8sapp-security-profiles-operator
summary = StarlingX sysinv extensions for security-profiles-operator
long_description = file: README.rst
long_description_content_type = text/x-rst
license = Apache 2.0
author = StarlingX
author-email = starlingx-discuss@lists.starlingx.io
home-page = https://www.starlingx.io/
classifier =
    Environment :: OpenStack
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python
    Programming Language :: Python :: 2
    Programming Language :: Python :: 2.7
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.4
    Programming Language :: Python :: 3.5

[files]
packages =
    k8sapp_security_profiles_operator

[global]
setup-hooks =
    pbr.hooks.setup_hook

[entry_points]
systemconfig.helm_applications =
    security-profiles-operator = systemconfig.helm_plugins.security_profiles_operator

systemconfig.helm_plugins.security_profiles_operator =
    001_security-profiles-operator = k8sapp_security_profiles_operator.helm.security_profiles_operator:SecurityProfilesOperatorHelm

systemconfig.app_lifecycle =
    security-profiles-operator = k8sapp_security_profiles_operator.lifecycle.lifecycle_security_profiles_operator:SecurityProfilesOperatorAppLifecycleOperator

[wheel]
universal = 1
